services:
  mysql:
    image: mysql:8.4
    container_name: learnmanager-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: learnmanager
      MYSQL_USER: learnmanager
      MYSQL_PASSWORD: learnmanager
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data: