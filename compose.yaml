name: learnmanager

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learnmanager}
      MYSQL_USER: ${MYSQL_USER:-learnmanager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnmanager}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-learnmanager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Vienna"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-learnmanager}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-learnmanager}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      JWT_SECRET: ${JWT_SECRET:-c3R1ZGl1bS1sZWFybm1hbmFnZXItZGV2LWp3dC1zZWNyZXQtMjAyNg==}

      TZ: Europe/Vienna
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Vienna"

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: